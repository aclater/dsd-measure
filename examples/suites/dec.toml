# The two devices below write different output rates (176.4 and 352.8 kHz), so a report of this suite marks the
# comparison "not like-for-like" and does not compare distortion and noise. Give both the same rate (and, for an
# integer output, the same word length) for a comparison.
[suite]
name = "decoders"
profile = "full"
out = "out-dec"
in_rate = 88200

[[device]]
name = "dsd2pcm 0.1.1"
adapter = "cli"
class = "A"
command = "dsd2pcm {input} {output} --rate 176400"

[[device]]
name = "ffmpeg-free 7.1.5"
adapter = "cli"
class = "A"
input_ext = "dff"
command = "tools/reftool-file.sh ffmpeg {input} {output} -v error -y -i @IN -c:a pcm_f32le @OUT"
