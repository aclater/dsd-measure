[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsd-measure"
version = "0.1.2"
description = "Deterministic audiophile measurement kit for DSD and PCM converters"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
dsd-measure = "dsd_measure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsd_measure = ["csrc/*.c", "data/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the measurement suite on the reference chain (minutes); skipped with -m \"not slow\""]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741", "E501"]
